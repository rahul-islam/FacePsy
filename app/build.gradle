apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply from: '../dependencies.gradle'

android {
    namespace 'com.rahulislam.facepsy'
    compileSdk versions.compileSdk
    defaultConfig {
        applicationId "com.rahulislam.facepsy"
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        versionCode versions.publishVersionCode
        versionName versions.publishVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Limits which ABIs of bundled native deps (TFLite, ML Kit) are packaged.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            pickFirsts += ["**/libc++_shared.so"]
        }
    }
}

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
    androidResources {
        noCompress "tflite", "lite"
    }
}

repositories {
//    maven { url 'https://google.bintray.com/tensorflow' }
    maven { url "https://jitpack.io" }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
//    compile "org.jetbrains.kotlinx:kotlinx-coroutines-android:0.22.2"
    implementation 'com.google.code.gson:gson:2.8.6'
    def work_version = "2.3.4"

    // Kotlin + coroutines
    implementation "androidx.work:work-runtime-ktx:$work_version"

    // Firebase BoM. NOTE: a second, newer BoM is declared further below; Gradle resolves
    // to the highest version. Kept as-is to avoid changing the resolved dependency set.
    implementation platform('com.google.firebase:firebase-bom:25.4.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.firebaseui:firebase-ui-auth:7.2.0'
    implementation 'com.google.firebase:firebase-storage-ktx'

    // Add the dependencies for the Firebase Cloud Messaging and Analytics libraries
    implementation 'com.google.firebase:firebase-messaging-ktx:20.3.0'
    implementation 'com.google.firebase:firebase-analytics-ktx:17.5.0'

    implementation "com.lyft.kronos:kronos-android:0.0.1-alpha09"

    // Face features
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.guava:guava:17.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:' + versions.kotlin

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.1.1'

    implementation 'androidx.core:core-ktx:' + versions.ktx
    implementation 'androidx.appcompat:appcompat:' + versions.androidx
    implementation 'org.apache.commons:commons-compress:1.16'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // CameraX: records each capture session as an MP4 (video + audio) with the front camera.
    def camerax_version = "1.4.2"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-video:$camerax_version"

    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:25.12.0')

    // LiteRT (successor of TensorFlow Lite, same org.tensorflow.lite API) runs the AU model.
    // 1.4.x ships 16 KB page-aligned native libraries; TensorFlow Lite 2.x does not.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-support:1.4.2'

}

configurations {
    // Resolves dependency conflict caused by some dependencies use
    // com.google.guava:guava and com.google.guava:listenablefuture together.
    all*.exclude group: 'com.google.guava', module: 'listenablefuture'
    // LiteRT provides the org.tensorflow.lite classes; drop any legacy TensorFlow Lite copy.
    all*.exclude group: 'org.tensorflow'
}