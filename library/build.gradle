apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply from: '../dependencies.gradle'

// Kotlin module name kept from the upstream HiddenCam publishing config (formerly bintrayconfig.gradle).
ext.modulePackageId = 'com.cottacush.HiddenCamera'

android {
    namespace 'com.cottacush.android.hiddencam'
    compileSdk versions.compileSdk

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
        freeCompilerArgs += ['-module-name', modulePackageId]
    }

    defaultConfig {
        minSdk versions.minSdk
    }

    sourceSets {
        main.res.srcDirs = [
                'src/main/res',
                'src/main/res-public'
        ]
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:' + versions.androidx
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:' + versions.kotlin
    implementation 'androidx.camera:camera-core:' + versions.cameraX
    implementation 'androidx.camera:camera-camera2:' + versions.cameraX
}
